name: Unpack CCA archive

on:
  push:
    paths:
      - 'CCA_Prototype 0.1.1.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack CCA archive
        run: |
          unzip -o 'CCA_Prototype 0.1.1.zip' -d .
          rm 'CCA_Prototype 0.1.1.zip'
      - name: Commit extracted files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Unpack CCA archive' || exit 0
          git push
